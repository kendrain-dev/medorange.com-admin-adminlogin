        <script>
        $('.comshowpassicon').on('click', function() {
            var inputType = $('.comshowpasscl').attr('type');
            if (inputType == 'password') {
                $('.comshowpasscl').attr('type', 'text');
                $('.comshowpassicon').hide();
                $('.comhidepassicon').show();
            } else {
                $('.comshowpasscl').attr('type', 'password');
                $('.comshowpassicon').show();
                $('.comhidepassicon').hide();
            }
        });
        $('.comhidepassicon').on('click', function() {
            var inputType = $('.comshowpasscl').attr('type');
            if (inputType == 'password') {
                $('.comshowpasscl').attr('type', 'text');
                $('.comshowpassicon').hide();
                $('.comhidepassicon').show();
            } else {
                $('.comshowpasscl').attr('type', 'password');
                $('.comshowpassicon').show();
                $('.comhidepassicon').hide();
            }
        });
        </script>
